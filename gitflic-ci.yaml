stages:
  - deploy

# Простой тестовый job с before_script и after_script
debug_job:
  stage: deploy
  before_script:
    - echo "Начало выполнения задачи"
  script:
    - echo "Файл конфигурации работает"
  after_script:
    - echo "Задача завершена"

# Основная задача для синхронизации
sync_to_github:
  stage: deploy
  before_script:
    - echo "Начинаем синхронизацию с GitHub"
  script:
    - git config --global user.name "gitflic-bot"
    - git config --global user.email "bot@gitflic.ru"
    - git remote add github https://s-evg:${GITHUB_SYNC}@github.com/s-evg/CoLearn.git
    - git push github --all
    - git push github --tags
  after_script:
    - echo "Синхронизация завершена"
  only:
    - branches
