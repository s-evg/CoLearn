stages:
  - test
  - sync

# Простой тестовый job
test_job:
  stage: test
  script:
    - echo "Hello, World!"

# Основная задача для синхронизации
sync_to_github:
  stage: sync
  script:
    - echo "Начинаем синхронизацию с GitHub"
    - git config --global user.name "gitflic-bot"
    - git config --global user.email "bot@gitflic.ru"
    - git remote add github https://s-evg:${GITHUB_SYNC}@github.com/s-evg/CoLearn.git
    - git push github --all
    - git push github --tags
  only:
    - branches
